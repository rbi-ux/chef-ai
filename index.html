<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulario de receta — Aileas Keto × Nutri Habits</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4efe6;
  --card-bg: #ffffff;
  --ink: #2b241d;
  --ink-soft: #6b5f4f;
  --accent: #2f6f52;
  --accent-dark: #21503b;
  --border: #e5dccb;
  --success-bg: #fbf6ec;
  --error-bg: #fdecec;
  --error-border: #f3b8b8;
  --error-ink: #7a2020;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #1c1712;
    --card-bg: #262019;
    --ink: #f0e9dc;
    --ink-soft: #b7a992;
    --accent: #5fae8a;
    --accent-dark: #3f8a68;
    --border: #3a3226;
    --success-bg: #241f17;
    --error-bg: #2e1c1c;
    --error-border: #5c2e2e;
    --error-ink: #f0b4b4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1712;
  --card-bg: #262019;
  --ink: #f0e9dc;
  --ink-soft: #b7a992;
  --accent: #5fae8a;
  --accent-dark: #3f8a68;
  --border: #3a3226;
  --success-bg: #241f17;
  --error-bg: #2e1c1c;
  --error-border: #5c2e2e;
  --error-ink: #f0b4b4;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4efe6;
  --card-bg: #ffffff;
  --ink: #2b241d;
  --ink-soft: #6b5f4f;
  --accent: #2f6f52;
  --accent-dark: #21503b;
  --border: #e5dccb;
  --success-bg: #fbf6ec;
  --error-bg: #fdecec;
  --error-border: #f3b8b8;
  --error-ink: #7a2020;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Georgia", "Iowan Old Style", serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

.app {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

.app-header {
  text-align: center;
  margin-bottom: 32px;
}

.app-header h1 {
  font-size: 2.2rem;
  margin: 0 0 8px;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 1rem;
  margin: 0;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px rgba(43, 36, 29, 0.04);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 0.95rem;
}

textarea,
input[type="password"],
input[type="text"] {
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
}

textarea:focus,
input:focus,
select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.api-key-row {
  display: flex;
  gap: 8px;
}

.api-key-row input {
  flex: 1;
}

.icon-btn {
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 10px;
  padding: 0 12px;
  cursor: pointer;
  font-size: 1rem;
  color: var(--ink);
}

.hint {
  color: var(--ink-soft);
  font-size: 0.82rem;
  margin: 10px 0 0;
  line-height: 1.4;
}

.hint a {
  color: var(--accent);
}

.options-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.select-label {
  flex: 1;
  min-width: 220px;
}

select {
  width: 100%;
  font-family: inherit;
  font-size: 0.95rem;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
}

.primary-btn {
  background: var(--accent);
  color: #fff;
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s ease;
}

.primary-btn:hover {
  background: var(--accent-dark);
}

.primary-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.secondary-btn {
  background: var(--ink);
  color: var(--bg);
  padding: 0 16px;
  border-radius: 10px;
  font-size: 0.9rem;
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.result-card {
  background: var(--success-bg);
  border-color: var(--border);
}

.result-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.toolbar-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.toolbar-btn:hover {
  background: var(--bg);
  border-color: var(--accent);
}

.toolbar-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.edit-hint {
  font-size: 0.8rem;
  color: var(--ink-soft);
  font-style: italic;
}

#resultContent[contenteditable="true"] {
  outline: 2px dashed var(--accent);
  outline-offset: 8px;
  border-radius: 8px;
  cursor: text;
}

#resultContent[contenteditable="true"]:focus {
  outline-color: var(--accent-dark);
}

#resultContent h2 {
  font-size: 1.5rem;
  margin: 0 0 4px;
  color: var(--accent-dark);
}

#resultContent h3 {
  font-size: 1.05rem;
  margin: 22px 0 8px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}

#resultContent p {
  line-height: 1.6;
  margin: 6px 0;
}

#resultContent ul,
#resultContent ol {
  line-height: 1.7;
  padding-left: 24px;
}

#resultContent li {
  margin-bottom: 4px;
}

#resultContent strong {
  color: var(--ink);
}

.meta-row {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin: 8px 0 4px;
  font-size: 0.88rem;
  color: var(--ink-soft);
}

.meta-row span {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
}

.error-box {
  background: var(--error-bg);
  border: 1px solid var(--error-border);
  color: var(--error-ink);
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 0.92rem;
  line-height: 1.5;
}

@media (max-width: 480px) {
  .app-header h1 {
    font-size: 1.8rem;
  }
  .card {
    padding: 18px;
  }
}


/* --- Formulario de envío de recetas --- */
.form-fields {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  margin-bottom: 0;
}

.optional-tag {
  font-weight: normal;
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 16px;
}

input[type="number"] {
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
}

input[type="file"] {
  font-family: inherit;
  font-size: 0.88rem;
  color: var(--ink-soft);
}

.field-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.field-header label {
  margin-bottom: 0;
}

.ghost-btn {
  background: transparent;
  border: 1px dashed var(--accent);
  color: var(--accent);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.85rem;
  font-weight: bold;
  white-space: nowrap;
}

.ghost-btn:hover {
  background: var(--success-bg);
}

.dynamic-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dynamic-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}

.dynamic-row input,
.dynamic-row select {
  width: auto;
  flex: 1;
  min-width: 0;
  font-family: inherit;
  font-size: 0.92rem;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--ink);
}

.ingredient-row .ing-name {
  flex: 2;
}

.ingredient-row .ing-qty {
  flex: 1;
  min-width: 64px;
}

.ingredient-row .ing-unit {
  flex: 0 0 70px;
}

.step-row {
  align-items: flex-start;
}

.step-num {
  flex: 0 0 22px;
  height: 22px;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 0.76rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step-row .step-text {
  flex: 1;
}

.step-actions {
  display: flex;
  gap: 4px;
  flex: 0 0 auto;
}

.row-move-btn,
.row-remove-btn {
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--ink-soft);
  border-radius: 6px;
  width: 28px;
  height: 28px;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex: 0 0 28px;
}

.row-move-btn:hover,
.row-remove-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.row-move-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.invalid {
  outline: 2px solid var(--error-border);
  outline-offset: 1px;
}

@media (max-width: 480px) {
  .dynamic-row {
    flex-wrap: wrap;
  }
  .ingredient-row .ing-name {
    flex: 1 1 100%;
  }
  .ingredient-row .ing-qty {
    flex: 1 1 auto;
  }
  .ingredient-row .ing-unit {
    flex: 0 0 64px;
  }
}

.result-card h2 {
  font-size: 1.4rem;
  color: var(--accent-dark);
  margin: 0 0 8px;
}

.result-card > p {
  color: var(--ink-soft);
  margin: 0 0 16px;
}
</style>
</head>
<body>

<div class="app" id="appRoot">
  <header class="app-header">
    <h1>🥑 Formulario de receta</h1>
    <p class="subtitle">Colaboración con Aileas Keto × Nutri Habits — comparte tu receta y la sumamos a la colección.</p>
  </header>

  <section class="card">
    <form id="recipeForm" novalidate>
      <div class="form-fields">
        <div class="field">
          <label for="authorInput">Autor</label>
          <input type="text" id="authorInput" required />
        </div>

        <div class="field">
          <label for="titleInput">Título de la receta</label>
          <input type="text" id="titleInput" required />
        </div>

        <div class="field">
          <label for="storyInput">Historieta</label>
          <textarea id="storyInput" rows="3" placeholder="La pequeña anécdota que acompaña a tu receta..." required></textarea>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="prepTimeInput">Preparación (min)</label>
            <input type="number" id="prepTimeInput" min="0" required />
          </div>
          <div class="field">
            <label for="cookTimeInput">Cocción (min)</label>
            <input type="number" id="cookTimeInput" min="0" required />
          </div>
          <div class="field">
            <label for="servingsInput">Raciones</label>
            <input type="number" id="servingsInput" min="1" required />
          </div>
          <div class="field">
            <label for="difficultySelect">Dificultad</label>
            <select id="difficultySelect" required>
              <option value="" disabled selected>Elige una opción</option>
              <option value="Fácil">Fácil</option>
              <option value="Medio">Medio</option>
              <option value="Difícil">Difícil</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Ingredientes</label>
          <div id="ingredientsList" class="dynamic-list"></div>
          <button type="button" class="ghost-btn" id="addIngredientBtn">+ Añadir ingrediente</button>
        </div>

        <div class="field">
          <label>Paso a paso</label>
          <div id="stepsList" class="dynamic-list"></div>
          <button type="button" class="ghost-btn" id="addStepBtn">+ Añadir paso</button>
        </div>

        <div class="field">
          <label for="imageInput">Imagen de la receta <span class="optional-tag">(opcional)</span></label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>
      </div>

      <button id="submitBtn" type="submit" class="primary-btn" style="margin-top: 22px">
        <span class="btn-text">Enviar receta</span>
        <span class="spinner" hidden></span>
      </button>
    </form>
  </section>

  <section class="card result-card" id="successCard" hidden>
    <h2 style="margin-top: 0">¡Receta enviada! 🎉</h2>
    <p>Gracias por compartir tu receta. La hemos recibido correctamente.</p>
    <button type="button" class="toolbar-btn" id="sendAnotherBtn">Enviar otra receta</button>
  </section>

  <section class="error-box" id="errorBox" hidden></section>
</div>

<script>
// --- Formulario de envío de recetas -----------------------------------
// Sitio estático (GitHub Pages), sin backend: cada envío se manda directo a
// un chat de Telegram vía la Bot API. El token va necesariamente en este JS
// visible en el navegador (no hay forma de ocultarlo sin un backend propio);
// el riesgo si alguien lo copia es que podría mandar mensajes a este chat,
// no leer nada ni acceder a ninguna cuenta.
const TELEGRAM_BOT_TOKEN = "8944080614:AAF5ZNA7XOMnLbhQBkHXtLXgZGlD1hNE0eE";
const TELEGRAM_CHAT_ID = "8150303209";
const UNIT_OPTIONS = ["g", "kg", "ml", "l"];

const recipeForm = document.getElementById("recipeForm");
const formCard = recipeForm.closest(".card");
const successCard = document.getElementById("successCard");
const errorBox = document.getElementById("errorBox");
const submitBtn = document.getElementById("submitBtn");
const submitBtnText = submitBtn.querySelector(".btn-text");
const submitSpinner = submitBtn.querySelector(".spinner");

const ingredientsList = document.getElementById("ingredientsList");
const stepsList = document.getElementById("stepsList");

document.getElementById("addIngredientBtn").addEventListener("click", () => addIngredientRow());
document.getElementById("addStepBtn").addEventListener("click", () => addStepRow());

function addIngredientRow() {
  const row = document.createElement("div");
  row.className = "dynamic-row ingredient-row";
  row.innerHTML =
    '<input type="text" class="ing-name" placeholder="Nombre (ej. harina)" />' +
    '<input type="number" class="ing-qty" placeholder="Cantidad" min="0" step="any" />' +
    '<select class="ing-unit">' +
    '<option value="g">g</option>' +
    '<option value="kg">kg</option>' +
    '<option value="ml">ml</option>' +
    '<option value="l">l</option>' +
    "</select>" +
    '<button type="button" class="row-remove-btn" aria-label="Eliminar ingrediente">✕</button>';
  row.querySelector(".row-remove-btn").addEventListener("click", () => {
    if (ingredientsList.children.length > 1) row.remove();
  });
  ingredientsList.appendChild(row);
}

function addStepRow() {
  const row = document.createElement("div");
  row.className = "dynamic-row step-row";
  row.innerHTML =
    '<span class="step-num"></span>' +
    '<input type="text" class="step-text" placeholder="Describe este paso..." />' +
    '<div class="step-actions">' +
    '<button type="button" class="row-move-btn" data-dir="up" aria-label="Subir paso">↑</button>' +
    '<button type="button" class="row-move-btn" data-dir="down" aria-label="Bajar paso">↓</button>' +
    '<button type="button" class="row-remove-btn" aria-label="Eliminar paso">✕</button>' +
    "</div>";
  row.querySelector('[data-dir="up"]').addEventListener("click", () => {
    const prev = row.previousElementSibling;
    if (prev) stepsList.insertBefore(row, prev);
    renumberSteps();
  });
  row.querySelector('[data-dir="down"]').addEventListener("click", () => {
    const next = row.nextElementSibling;
    if (next) stepsList.insertBefore(next, row);
    renumberSteps();
  });
  row.querySelector(".row-remove-btn").addEventListener("click", () => {
    if (stepsList.children.length > 1) {
      row.remove();
      renumberSteps();
    }
  });
  stepsList.appendChild(row);
  renumberSteps();
}

function renumberSteps() {
  const rows = [...stepsList.children];
  rows.forEach((row, i) => {
    row.querySelector(".step-num").textContent = i + 1;
    row.querySelector('[data-dir="up"]').disabled = i === 0;
    row.querySelector('[data-dir="down"]').disabled = i === rows.length - 1;
  });
}

// Fila inicial de ingrediente y de paso
addIngredientRow();
addStepRow();

function showError(message) {
  errorBox.textContent = message;
  errorBox.hidden = false;
  errorBox.scrollIntoView({ behavior: "smooth", block: "center" });
}

function hideError() {
  errorBox.hidden = true;
  errorBox.textContent = "";
}

function clearInvalid() {
  recipeForm.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
}

function markInvalid(el) {
  el.classList.add("invalid");
}

function validateForm() {
  clearInvalid();
  const errors = [];

  const author = document.getElementById("authorInput");
  const title = document.getElementById("titleInput");
  const story = document.getElementById("storyInput");
  const prepTime = document.getElementById("prepTimeInput");
  const cookTime = document.getElementById("cookTimeInput");
  const servings = document.getElementById("servingsInput");
  const difficulty = document.getElementById("difficultySelect");

  if (!author.value.trim()) {
    markInvalid(author);
    errors.push("Falta el autor.");
  }
  if (!title.value.trim()) {
    markInvalid(title);
    errors.push("Falta el título de la receta.");
  }
  if (!story.value.trim()) {
    markInvalid(story);
    errors.push("Falta la historieta.");
  }
  if (prepTime.value === "" || Number(prepTime.value) < 0) {
    markInvalid(prepTime);
    errors.push("Indica el tiempo de preparación.");
  }
  if (cookTime.value === "" || Number(cookTime.value) < 0) {
    markInvalid(cookTime);
    errors.push("Indica el tiempo de cocción.");
  }
  if (servings.value === "" || Number(servings.value) < 1) {
    markInvalid(servings);
    errors.push("Indica el número de raciones.");
  }
  if (!difficulty.value) {
    markInvalid(difficulty);
    errors.push("Elige un nivel de dificultad.");
  }

  const ingredients = [];
  [...ingredientsList.children].forEach((row) => {
    const name = row.querySelector(".ing-name");
    const qty = row.querySelector(".ing-qty");
    const unit = row.querySelector(".ing-unit");
    const hasAny = name.value.trim() || qty.value !== "";
    if (!name.value.trim() || qty.value === "" || Number(qty.value) <= 0) {
      if (hasAny) {
        markInvalid(name);
        markInvalid(qty);
      }
      return;
    }
    if (!UNIT_OPTIONS.includes(unit.value)) {
      markInvalid(unit);
      errors.push("Unidad de ingrediente no válida (solo g, kg, ml o l).");
      return;
    }
    ingredients.push({ name: name.value.trim(), qty: qty.value, unit: unit.value });
  });
  if (ingredients.length === 0) {
    errors.push("Añade al menos un ingrediente completo (nombre, cantidad y unidad).");
  }

  const steps = [];
  [...stepsList.children].forEach((row) => {
    const text = row.querySelector(".step-text");
    if (text.value.trim()) steps.push(text.value.trim());
    else markInvalid(text);
  });
  if (steps.length === 0) {
    errors.push("Añade al menos un paso.");
  }

  return { valid: errors.length === 0, errors: errors, ingredients: ingredients, steps: steps };
}

// Reescala y comprime la imagen en el propio navegador antes de enviarla.
// Evita fallos de envío con fotos pesadas (muy comunes desde el móvil) y
// hace que la subida sea rápida incluso en redes móviles lentas.
function resizeImageFile(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let width = img.naturalWidth;
      let height = img.naturalHeight;
      if (width > maxDimension || height > maxDimension) {
        if (width >= height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(
        (blob) => {
          if (blob) resolve(blob);
          else reject(new Error("No se pudo procesar la imagen"));
        },
        "image/jpeg",
        quality
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("No se pudo leer la imagen"));
    };
    img.src = url;
  });
}

recipeForm.addEventListener("submit", async function (e) {
  e.preventDefault();
  hideError();

  const result = validateForm();
  if (!result.valid) {
    const extra = result.errors.length > 1 ? " (y " + (result.errors.length - 1) + " más)" : "";
    showError(result.errors[0] + extra);
    return;
  }

  const autor = document.getElementById("authorInput").value.trim();
  const titulo = document.getElementById("titleInput").value.trim();
  const historieta = document.getElementById("storyInput").value.trim();
  const tiempoPrep = document.getElementById("prepTimeInput").value;
  const tiempoCoccion = document.getElementById("cookTimeInput").value;
  const raciones = document.getElementById("servingsInput").value;
  const dificultad = document.getElementById("difficultySelect").value;
  const ingredientesTexto = result.ingredients.map((i) => "- " + i.name + ": " + i.qty + " " + i.unit).join("\n");
  const pasosTexto = result.steps.map((s, i) => i + 1 + ". " + s).join("\n");
  const imageFile = document.getElementById("imageInput").files[0];

  // Texto plano, sin parse_mode: si se usa Markdown/HTML de Telegram, un
  // carácter especial dentro de lo que escriba el usuario (un "_" o un "*")
  // puede romper el parseo y que sendMessage devuelva error 400.
  const messageText =
    "🥑 Nueva receta recibida\n\n" +
    "Autor: " + autor + "\n" +
    "Titulo: " + titulo + "\n" +
    "Historieta: " + historieta + "\n\n" +
    "Preparacion: " + tiempoPrep + " min · Coccion: " + tiempoCoccion + " min · Raciones: " + raciones + "\n" +
    "Dificultad: " + dificultad + "\n\n" +
    "Ingredientes:\n" + ingredientesTexto + "\n\n" +
    "Pasos:\n" + pasosTexto;

  submitBtn.disabled = true;
  submitSpinner.hidden = false;
  submitBtnText.textContent = "Enviando...";

  try {
    if (imageFile) {
      submitBtnText.textContent = "Procesando imagen...";
      let photoBlob = imageFile;
      try {
        photoBlob = await resizeImageFile(imageFile, 1600, 0.82);
      } catch (imgErr) {
        console.error("No se pudo comprimir la imagen, se envía sin comprimir:", imgErr);
      }
      submitBtnText.textContent = "Enviando...";

      const photoForm = new FormData();
      photoForm.append("chat_id", TELEGRAM_CHAT_ID);
      photoForm.append("photo", photoBlob, "receta.jpg");
      photoForm.append("caption", "🥑 " + titulo + " — de " + autor);

      const photoRes = await fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendPhoto", {
        method: "POST",
        body: photoForm,
      });
      const photoPayload = await photoRes.json();
      if (!photoPayload.ok) {
        throw new Error(photoPayload.description || "No se pudo enviar la imagen");
      }
    }

    submitBtnText.textContent = "Enviando...";
    const msgRes = await fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: messageText }),
    });
    const msgPayload = await msgRes.json();
    if (!msgPayload.ok) {
      throw new Error(msgPayload.description || "No se pudo enviar la receta");
    }

    formCard.hidden = true;
    successCard.hidden = false;
    successCard.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    console.error("Fallo al enviar la receta:", err);
    showError(
      "No se pudo enviar la receta (" + err.message + "). Comprueba tu conexión e inténtalo de nuevo."
    );
  } finally {
    submitBtn.disabled = false;
    submitSpinner.hidden = true;
    submitBtnText.textContent = "Enviar receta";
  }
});

document.getElementById("sendAnotherBtn").addEventListener("click", () => {
  recipeForm.reset();
  ingredientsList.innerHTML = "";
  stepsList.innerHTML = "";
  addIngredientRow();
  addStepRow();
  successCard.hidden = true;
  formCard.hidden = false;
});
</script>
